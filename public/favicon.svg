<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Import Google Fonts: Inter -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=swap');
      .favicon-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: #090d16;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Rounded Amber square with black outline -->
  <rect x="10" y="10" width="100" height="100" fill="#f59e0b" stroke="#090d16" stroke-width="8" rx="22" ry="22"/>
  
  <!-- Letter A - precisely aligned to the optical center -->
  <text x="60" y="82" class="favicon-text">A</text>
</svg>
